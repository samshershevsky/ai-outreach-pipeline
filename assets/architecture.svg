<svg viewBox="0 0 820 1080" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <title>AI GTM pipeline architecture</title>
  <style>
    .box{fill:#FFFFFF;stroke:#E7DFD2;stroke-width:1.5}
    .box.accent{fill:#E3F0EC}
    .box.gate{fill:#0D6E5F}
    .box.gate + text, .gate ~ text{}
    .frame{fill:none;stroke:#0D6E5F;stroke-width:1.5;stroke-dasharray:7 6}
    .t-title{font:600 16px Inter,system-ui,sans-serif;fill:#1C1A17}
    .t-title.big{font-size:19px}
    .t-sub{font:400 13px Inter,system-ui,sans-serif;fill:#6E675E}
    .t-band{font:700 14px Inter,system-ui,sans-serif;fill:#0A574B}
    .arrow{stroke:#0D6E5F;stroke-width:2;fill:none;marker-end:url(#ah)}
    .arrowhead{fill:#0D6E5F}
    .gate-text{fill:#FFFFFF}
    @media (prefers-color-scheme: dark){
      .box{fill:#1E1A15;stroke:#3A352C}
      .box.accent{fill:#14332C}
      .t-title{fill:#EDE8DE}
      .t-sub{fill:#B9B2A6}
      .t-band{fill:#5BC8A9}
    }
  </style>

  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker></defs>
  <rect class="frame" x="8" y="8" width="804" height="1064" rx="20"/>
  <text class="t-band" x="28" y="38">Evals and monitoring layer: watches every agent run</text>
  <g>
    <rect class="box accent" x="210" y="56" width="400" height="76" rx="12"/>
    <text class="t-title big" x="410" y="90" text-anchor="middle">Orchestrator agent</text>
    <text class="t-sub" x="410" y="114" text-anchor="middle">Runs on Claude. Plans, routes, and checks output.</text>
  </g>
  <path class="arrow" d="M410 132 L410 168"/>
  <text class="t-sub" x="410" y="162" text-anchor="middle">coordinates six specialized sub agents</text>
    <g><rect class="box" x="28" y="176" width="244" height="64" rx="12"/><text class="t-title" x="150" y="204" text-anchor="middle">Prospecting</text><text class="t-sub" x="150" y="226" text-anchor="middle">finds target accounts</text></g>
    <g><rect class="box" x="288" y="176" width="244" height="64" rx="12"/><text class="t-title" x="410" y="204" text-anchor="middle">Enrichment</text><text class="t-sub" x="410" y="226" text-anchor="middle">firmographics and signals</text></g>
    <g><rect class="box" x="548" y="176" width="244" height="64" rx="12"/><text class="t-title" x="670" y="204" text-anchor="middle">Scoring</text><text class="t-sub" x="670" y="226" text-anchor="middle">rubric score with reasons</text></g>
    <g><rect class="box" x="28" y="256" width="244" height="64" rx="12"/><text class="t-title" x="150" y="284" text-anchor="middle">Drafting</text><text class="t-sub" x="150" y="306" text-anchor="middle">writes the first touch</text></g>
    <g><rect class="box" x="288" y="256" width="244" height="64" rx="12"/><text class="t-title" x="410" y="284" text-anchor="middle">CRM hygiene</text><text class="t-sub" x="410" y="306" text-anchor="middle">dedupe and cleanup</text></g>
    <g><rect class="box" x="548" y="256" width="244" height="64" rx="12"/><text class="t-title" x="670" y="284" text-anchor="middle">Reporting</text><text class="t-sub" x="670" y="306" text-anchor="middle">digest of every run</text></g>
  <path class="arrow" d="M410 336 L410 368"/>
  <g>
    <rect class="box accent" x="28" y="372" width="764" height="72" rx="12"/>
    <text class="t-title big" x="410" y="404" text-anchor="middle">Custom MCP server: gtm-pipeline-mcp</text>
    <text class="t-sub" x="410" y="428" text-anchor="middle">The one controlled doorway between the agents and the tools</text>
  </g>
  <path class="arrow" d="M410 444 L410 476"/>
  <text class="t-sub" x="410" y="470" text-anchor="middle">tools the server can call</text>
    <g><rect class="box" x="28" y="482" width="244" height="64" rx="12"/><text class="t-title" x="150" y="510" text-anchor="middle">Clay</text><text class="t-sub" x="150" y="532" text-anchor="middle">enrichment waterfalls</text></g>
    <g><rect class="box" x="288" y="482" width="244" height="64" rx="12"/><text class="t-title" x="410" y="510" text-anchor="middle">Apollo</text><text class="t-sub" x="410" y="532" text-anchor="middle">prospect data</text></g>
    <g><rect class="box" x="548" y="482" width="244" height="64" rx="12"/><text class="t-title" x="670" y="510" text-anchor="middle">HubSpot</text><text class="t-sub" x="670" y="532" text-anchor="middle">CRM of record</text></g>
    <g><rect class="box" x="28" y="562" width="244" height="64" rx="12"/><text class="t-title" x="150" y="590" text-anchor="middle">Google Workspace</text><text class="t-sub" x="150" y="612" text-anchor="middle">mail and calendar</text></g>
    <g><rect class="box" x="288" y="562" width="244" height="64" rx="12"/><text class="t-title" x="410" y="590" text-anchor="middle">Internal REST APIs</text><text class="t-sub" x="410" y="612" text-anchor="middle">account data</text></g>
    <g><rect class="box" x="548" y="562" width="244" height="64" rx="12"/><text class="t-title" x="670" y="590" text-anchor="middle">Internal GraphQL APIs</text><text class="t-sub" x="670" y="612" text-anchor="middle">product data</text></g>
  <path class="arrow" d="M410 642 L410 678"/>
  <g>
    <rect class="box" x="210" y="682" width="400" height="64" rx="12"/>
    <text class="t-title" x="410" y="710" text-anchor="middle">Drafts queue</text>
    <text class="t-sub" x="410" y="732" text-anchor="middle">Every draft waits here first</text>
  </g>
  <path class="arrow" d="M410 746 L410 782"/>
  <g>
    <rect class="box gate" x="210" y="786" width="400" height="76" rx="12"/>
    <text class="t-title big gate-text" x="410" y="820" text-anchor="middle">Human approval</text>
    <text class="t-sub gate-text" x="410" y="844" text-anchor="middle">A person approves every send. Nothing skips this step.</text>
  </g>
  <path class="arrow" d="M410 862 L410 898"/>
  <g>
    <rect class="box" x="210" y="902" width="400" height="64" rx="12"/>
    <text class="t-title" x="410" y="930" text-anchor="middle">Send</text>
    <text class="t-sub" x="410" y="952" text-anchor="middle">Only approved drafts go out</text>
  </g>
  <g>
    <rect class="box band" x="28" y="992" width="764" height="56" rx="12"/>
    <text class="t-title" x="410" y="1027" text-anchor="middle">Monitoring watches: failed tool calls, latency spikes, low confidence scores</text>
  </g>
</svg>